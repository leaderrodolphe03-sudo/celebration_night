<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none">
  <defs>
    <linearGradient id="cn-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD84A" />
      <stop offset="50%" stop-color="#F5B900" />
      <stop offset="100%" stop-color="#D49A00" />
    </linearGradient>
    <linearGradient id="cn-ray" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E5252A" stop-opacity="0" />
      <stop offset="100%" stop-color="#F5B900" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Emblème stylisé : Étoile / Flamme de célébration -->
  <g transform="translate(10, 8)">
    <circle cx="26" cy="26" r="24" fill="#24080C" fill-opacity="0.8" stroke="#E5252A" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- Rayons d'adoration -->
    <path d="M26 4 L29 20 L45 26 L29 32 L26 48 L23 32 L7 26 L23 20 Z" fill="url(#cn-gold-grad)"/>
    <circle cx="26" cy="26" r="4" fill="#FFFFFF"/>
    <!-- Petite étincelle -->
    <circle cx="38" cy="14" r="1.5" fill="#FFD84A"/>
  </g>

  <!-- Typographie du titre -->
  <g transform="translate(74, 18)">
    <text x="0" y="24" font-family="'Bebas Neue', 'Arial Black', sans-serif" font-size="28" letter-spacing="3" fill="#FFFFFF" font-weight="900">
      CÉLÉBRATION
    </text>
    <text x="145" y="24" font-family="'Bebas Neue', 'Arial Black', sans-serif" font-size="28" letter-spacing="3" fill="url(#cn-gold-grad)" font-weight="900">
      NIGHT
    </text>
    <text x="2" y="38" font-family="'Montserrat', sans-serif" font-size="7.5" letter-spacing="4" fill="#FFD84A" font-weight="600" opacity="0.9">
      UNE GÉNÉRATION • UNE FOI • UNE CÉLÉBRATION
    </text>
  </g>
</svg>
