<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 70" fill="none">
  <defs>
    <linearGradient id="hag-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD84A" />
      <stop offset="100%" stop-color="#F5B900" />
    </linearGradient>
  </defs>

  <!-- Symbole Croix & Alpha épurée -->
  <g transform="translate(12, 10)">
    <rect x="20" y="2" width="6" height="46" rx="3" fill="url(#hag-gold)"/>
    <rect x="8" y="16" width="30" height="6" rx="3" fill="url(#hag-gold)"/>
    <!-- Cercle d'alliance spirituelle -->
    <circle cx="23" cy="25" r="16" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="2 3"/>
  </g>

  <!-- Texte HAGIAZO MINISTRY -->
  <g transform="translate(68, 20)">
    <text x="0" y="22" font-family="'Bebas Neue', 'Arial Black', sans-serif" font-size="28" letter-spacing="4" fill="#FFFFFF" font-weight="900">
      HAGIAZO
    </text>
    <text x="2" y="37" font-family="'Montserrat', sans-serif" font-size="9" letter-spacing="5" fill="#FFD84A" font-weight="600">
      MINISTRY
    </text>
  </g>
</svg>
